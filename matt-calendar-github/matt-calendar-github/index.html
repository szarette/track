<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Matt Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FFFFFF; --ink:#000000; --stone:#F3F3F1; --graphite:#6B6B6B; --hair:#E4E4E1;
  --dial:#1E2B45;
  --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Cormorant Garamond",Cormorant,Garamond,"Times New Roman",serif;
  --hero-h:clamp(280px,40vh,480px);
  --ov:.4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#000000;--ink:#FFFFFF;--stone:#141414;--graphite:#9B9B9B;--hair:#272727;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#000000;--ink:#FFFFFF;--stone:#141414;--graphite:#9B9B9B;--hair:#272727;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
em{font-family:var(--serif);font-style:italic;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App frame ---------- */
.app{position:relative;height:100%;display:flex;flex-direction:column;isolation:isolate}
.stage{position:absolute;left:0;right:0;top:0;height:var(--stage-h,var(--hero-h));overflow:hidden;z-index:0;background:var(--dial)}
.stage .bg{position:absolute;inset:0;background-size:cover;background-position:50% 50%;opacity:0;transition:opacity 1s ease}
.stage .bg.on{opacity:1}
.stage .pattern{opacity:1;background-color:var(--dial);
  background-image:
    linear-gradient(rgba(0,0,0,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.5) 1px,transparent 1px),
    linear-gradient(135deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 48%,rgba(0,0,0,.28) 100%);
  background-size:13px 13px,13px 13px,13px 13px}
.stage .pattern::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 28% 18%,rgba(255,255,255,.22),transparent 65%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,calc(var(--ov)*.6)) 0%,rgba(0,0,0,calc(var(--ov)*.15)) 40%,rgba(0,0,0,var(--ov)) 100%)}

.hero{position:relative;z-index:1;min-height:var(--hero-h);flex:none;color:#fff;display:flex;flex-direction:column;padding:18px clamp(16px,3vw,44px) 16px}
.topbar{display:flex;align-items:center;gap:20px 28px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.brand em{font-size:21px;margin-left:3px}
.views{display:flex;gap:26px;margin-inline:auto}
.views button{font-size:14px;padding:6px 0;opacity:.7;border-bottom:1px solid transparent;transition:opacity .2s}
.views button:hover{opacity:1}
.views button[aria-selected="true"]{opacity:1;border-bottom-color:currentColor}
.actions{display:flex;gap:10px;align-items:center}
.pill{height:38px;padding:0 18px;border-radius:999px;border:1px solid currentColor;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pill.sm{height:32px;padding:0 14px;font-size:13px}
.hero .pill.solid{background:#fff;color:#000;border-color:#fff}
.pill.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.circle{width:44px;height:44px;border-radius:50%;border:1px solid currentColor;display:inline-grid;place-items:center;flex:none;transition:background .2s,color .2s}
.circle.sm{width:38px;height:38px}
.hero .circle:hover{background:#fff;color:#000}
.hero-main{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.hero h1{margin:0;font-weight:300;font-size:clamp(44px,7.2vw,112px);line-height:.95;letter-spacing:-.025em}
.hero h1 em{letter-spacing:-.01em}
.hero-meta{margin:14px 0 0;font-size:15px;opacity:.88}
.hero-meta .clock{font-variant-numeric:tabular-nums}
.hero-nav{display:flex;gap:10px;padding-bottom:6px}
.hero-foot{margin-top:22px}
.track{height:1px;background:rgba(255,255,255,.35);position:relative}
.track span{position:absolute;left:0;top:-1px;height:3px;background:#fff}
.foot-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.foot-row .l,.foot-row .r{display:flex;gap:18px;flex-wrap:wrap;opacity:.88}
.foot-row .warn{font-weight:500}
.foot-row button{text-decoration:underline;text-underline-offset:3px}

.app[data-hero="compact"]{--hero-h:clamp(210px,26vh,250px)}
.app[data-hero="compact"] .hero h1{font-size:clamp(36px,4.6vw,64px)}
.app[data-hero="compact"] .hero-meta{margin-top:8px}
.app[data-hero="compact"] .hero-foot{margin-top:14px}
.app[data-hero="backdrop"]{--hero-h:clamp(250px,32vh,330px)}
.app[data-hero="backdrop"] .stage{position:fixed;inset:0;height:auto}
.app[data-hero="backdrop"] .shade{background:rgba(0,0,0,calc(var(--ov)*.8))}
.app[data-hero="backdrop"] .body{background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);margin:0 clamp(0px,1.4vw,20px) clamp(0px,1.4vw,20px)}

/* ---------- Body ---------- */
.body{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;background:var(--paper)}
.view{overflow:auto;min-height:0;padding:22px clamp(16px,2.4vw,36px) 32px}
.panel{overflow:auto;min-height:0;border-left:1px solid var(--hair);padding:14px 26px 48px}
.link{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;font-size:14px;cursor:pointer}
.link.small{font-size:13px;color:var(--graphite)}
.link.danger{color:#A12A2A}
:root[data-theme="dark"] .link.danger{color:#E27C7C}
.hint{font-size:13px;color:var(--graphite)}
.empty{color:var(--graphite);font-size:14px;padding:22px 0;max-width:38ch;margin:0}
.empty em{font-size:20px;color:var(--ink);display:block;margin-bottom:4px}

/* Month */
.month{display:flex;flex-direction:column;height:100%;min-height:0}
.wdrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12.5px;color:var(--graphite);padding:0 0 8px 2px}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(96px,1fr);border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.cell{position:relative;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:8px 8px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--paper);transition:background .15s;-webkit-touch-callout:none;user-select:none}
.cell:hover{background:var(--stone)}
.cell.hl{background:color-mix(in srgb,var(--hl) 14%,var(--paper));box-shadow:inset 3px 0 0 var(--hl)}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.hl.sel{box-shadow:inset 3px 0 0 var(--hl),inset 0 0 0 1.5px var(--ink)}
.cell-top{display:flex;align-items:center;gap:8px;min-height:30px}
.dnum{font-weight:300;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;min-width:30px;height:30px;display:inline-grid;place-items:center;border-radius:50%}
.cell.today .dnum{background:var(--ink);color:var(--paper);font-weight:400;font-size:16px}
.cell.out .dnum{color:var(--graphite);opacity:.55}
.cell.out .chips{opacity:.6}
.hl-note{font-size:11.5px;color:var(--hl);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;filter:saturate(1.1) brightness(.85)}
:root[data-theme="dark"] .hl-note{filter:brightness(1.4)}
.wk{position:absolute;top:10px;right:8px;font-size:10.5px;color:var(--graphite)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.35;min-width:0;border-radius:3px;padding:1px 3px;margin:0 -3px}
.chip:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c,#888);flex:none}
.chip .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tm{color:var(--graphite);font-variant-numeric:tabular-nums;flex:none}
.chip.done .tx{text-decoration:line-through;color:var(--graphite)}
.chip.ev i{border-radius:1px;transform:rotate(45deg)}
.more{font-size:12px;color:var(--graphite)}
.pbs{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.pb{font-size:10.5px;line-height:1.2;color:var(--graphite);border-bottom:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px;padding-bottom:1px}

/* Year */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 36px}
.ym-name{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.1;margin:0 0 10px;display:block}
.ym-name:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.ym-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12.5px}
.wdi{color:var(--graphite);text-align:center;font-size:10.5px;padding:2px 0 4px}
.yd{height:28px;display:grid;place-items:center;position:relative;border-radius:50%;font-variant-numeric:tabular-nums;-webkit-touch-callout:none}
.yd:hover{background:var(--stone)}
.yd.hl{background:color-mix(in srgb,var(--hl) 26%,transparent);border-radius:4px}
.yd.has::after{content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:currentColor}
.yd.today{background:var(--ink);color:var(--paper);border-radius:50%}
.yd.sel{box-shadow:inset 0 0 0 1px var(--ink)}

/* Week */
.week-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.week{display:grid;grid-template-columns:minmax(104px,136px) repeat(7,minmax(118px,1fr));border-top:1px solid var(--hair);border-left:1px solid var(--hair);min-width:940px}
.wk-h,.wk-l,.wk-c{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair)}
.wk-h{padding:10px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.wk-h small{font-size:12px;color:var(--graphite)}
.wk-h b{font-weight:300;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.wk-h.today b{font-family:var(--serif);font-style:italic;font-weight:500}
.wk-h.today{box-shadow:inset 0 -2px 0 var(--ink)}
.wk-h.hl{background:color-mix(in srgb,var(--hl) 14%,var(--paper))}
.wk-l{padding:12px 10px}
.wk-l b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:21px;line-height:1.1}
.wk-l span{font-size:12px;color:var(--graphite);font-variant-numeric:tabular-nums}
.wk-c{padding:6px;min-height:86px;display:flex;flex-direction:column;gap:4px;cursor:copy;min-width:0}
.wk-c:hover{background:var(--stone)}
.wk-c.hl{background:color-mix(in srgb,var(--hl) 9%,var(--paper))}
.wk-c.now{background:var(--stone);box-shadow:inset 2px 0 0 var(--ink)}
.blk{display:flex;gap:7px;align-items:flex-start;padding:6px 7px;background:var(--stone);border-left:2px solid var(--c,#888);font-size:12.5px;line-height:1.3;min-width:0;cursor:pointer}
.wk-c.now .blk,.wk-c:hover .blk{background:var(--paper)}
.blk .tx{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.blk .tm{display:block;color:var(--graphite);font-size:11.5px}
.blk.done .tx{text-decoration:line-through;color:var(--graphite)}
.blk .check{width:16px;height:16px;margin-top:0}

/* Day */
.day{max-width:880px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:18px;background:color-mix(in srgb,var(--c) 14%,var(--paper));border-left:3px solid var(--c);font-size:14px}
.dsec{border-top:1px solid var(--hair);padding:18px 0 16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px}
.dsec h3{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;line-height:1.05}
.dsec .range{display:block;font-size:13px;color:var(--graphite);margin-top:4px;font-variant-numeric:tabular-nums}
.dsec.now h3::after{content:"Now";font-family:var(--sans);font-style:normal;font-size:11.5px;font-weight:500;vertical-align:middle;margin-left:10px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--paper)}
.nowbar{display:block;height:1px;background:var(--hair);margin-top:12px;position:relative;max-width:160px}
.nowbar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}

/* Lists */
.list{list-style:none;margin:6px 0 10px;padding:0}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--hair)}
.list.tight .row{padding:8px 0}
.list.tight .row:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:50%;border:1px solid var(--c,var(--graphite));display:grid;place-items:center;flex:none;margin-top:1px;color:var(--paper);transition:background .15s}
.check svg{opacity:0}
.check:hover svg{opacity:.35;color:var(--ink)}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on svg{opacity:1;color:var(--paper)}
.dot{width:8px;height:8px;background:var(--c,#888);flex:none;margin:7px 6px 0;transform:rotate(45deg)}
.row-main{flex:1;min-width:0;text-align:left;display:block}
.row-title{display:block;font-size:15px;line-height:1.35;word-break:break-word}
.row.done .row-title{text-decoration:line-through;color:var(--graphite)}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--graphite);margin-top:2px}
.row-meta .pj::before{content:"";display:inline-block;width:7px;height:7px;background:var(--c);margin-right:5px;vertical-align:1px}
.row-main:hover .row-title{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.row.done .row-main:hover .row-title{text-decoration:line-through}
.group-h{font-family:var(--serif);font-style:italic;font-size:21px;font-weight:400;margin:22px 0 0}

/* Panel */
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--hair);margin-bottom:20px;position:sticky;top:-14px;background:var(--paper);padding-top:6px;z-index:2}
.app[data-hero="backdrop"] .ptabs{background:transparent}
.ptabs button{padding:10px 0;font-size:14px;color:var(--graphite);border-bottom:1px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ptabs sup{font-size:10.5px;margin-left:2px}
.p-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.p-head h2{margin:0;font-weight:300;font-size:28px;line-height:1.1;letter-spacing:-.015em}
.p-links{display:flex;gap:16px;margin-top:8px}
.quick{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);margin:18px 0 12px}
.quick input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;font-size:15px;outline:none}
.quick input::placeholder{color:var(--graphite)}
.quick .circle{width:32px;height:32px;border-color:var(--ink)}
.quick .circle:hover{background:var(--ink);color:var(--paper)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{min-height:30px;padding:3px 12px;border:1px solid var(--hair);border-radius:999px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
.chip-btn:hover{border-color:var(--ink)}
.chip-btn small{color:var(--graphite);font-size:11.5px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-btn[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip-btn .sw{width:9px;height:9px}
.chip-btn.dashed{border-style:dashed}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.proj{display:block;width:100%;text-align:left;padding:18px 0;border-bottom:1px solid var(--hair)}
.proj-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.proj-name{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.1}
.proj-name::before{content:"";display:inline-block;width:9px;height:9px;background:var(--c);margin-right:9px;vertical-align:3px}
.proj:hover .proj-name{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.status{font-size:11.5px;border:1px solid var(--hair);border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--graphite)}
.status.active{border-color:var(--ink);color:var(--ink)}
.proj-dates{font-size:13px;color:var(--graphite);margin-top:4px}
.bar{height:1px;background:var(--hair);margin:14px 0 8px;position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--c,var(--ink))}
.proj-foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--graphite)}
.proj-foot .late{color:#A12A2A}

/* Dialog */
dialog{border:0;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--paper);color:var(--ink);box-shadow:0 30px 90px rgba(0,0,0,.4);overflow:hidden}
dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog[open]{display:flex;flex-direction:column}
dialog > form{display:flex;flex-direction:column;min-height:0;flex:1}
dialog::backdrop{background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:24px 28px 4px;flex:none}
.dlg-head h2{font-weight:300;font-size:32px;line-height:1.05;margin:0;letter-spacing:-.02em}
.dlg-body{padding:16px 28px 22px;overflow:auto;flex:1;min-height:0}
.dlg-foot{display:flex;gap:10px;align-items:center;padding:14px 28px 22px;border-top:1px solid var(--hair);flex:none;flex-wrap:wrap}
.grow{flex:1}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;flex:none;color:var(--graphite)}
.icon-btn:hover{background:var(--stone);color:var(--ink)}
.field{display:block;margin:0 0 18px}
.field > span,.lbl{display:block;font-size:12.5px;color:var(--graphite);margin-bottom:6px}
.inp{width:100%;border:0;border-bottom:1px solid var(--hair);padding:9px 0;background:transparent;border-radius:0;outline:none;transition:border-color .15s}
.inp:focus{border-bottom-color:var(--ink)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
select.inp option{background:var(--paper);color:var(--ink)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5}
.big{font-size:26px;font-weight:300;border-bottom-color:var(--ink);margin-bottom:20px;padding:6px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--hair);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--graphite)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.newtab{display:grid;grid-template-columns:1fr 110px 110px auto;gap:10px;align-items:end;margin-top:12px;padding:12px;background:var(--stone)}
.stabs{display:flex;gap:22px;padding:6px 28px 0;border-bottom:1px solid var(--hair);overflow-x:auto;flex:none;scrollbar-width:none}
.stabs button{padding:12px 0;font-size:14px;color:var(--graphite);border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.setrow{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--hair)}
.setrow > span{font-size:14px}
.setrow .hint{display:block;margin-top:2px}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
.lrow.tabs{grid-template-columns:minmax(0,1fr) 108px 108px auto}
input[type="color"]{width:32px;height:32px;border:1px solid var(--hair);border-radius:50%;padding:0;background:none;cursor:pointer;overflow:hidden}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch{border:0;border-radius:50%}
input[type="color"]::-moz-color-swatch{border:0;border-radius:50%}
input[type="range"]{width:100%;accent-color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;margin-top:18px}
.ph{margin:0}
.ph-img{aspect-ratio:16/9;background:var(--stone) center/cover no-repeat}
.ph figcaption{padding-top:10px}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}
.mgrid button{font-size:11.5px;padding:4px 0;border:1px solid var(--hair);text-align:center}
.mgrid button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.palette button{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--hair)}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
hr{border:0;border-top:1px solid var(--hair);margin:22px 0}

/* Popover */
.pop{position:fixed;z-index:60;width:292px;background:var(--paper);color:var(--ink);border:1px solid var(--hair);box-shadow:0 20px 60px rgba(0,0,0,.28);padding:16px 18px 14px}
.pop[hidden]{display:none}
.pop-head{display:flex;justify-content:space-between;align-items:center;margin:-4px -8px 10px 0}
.pop-head strong{font-weight:500;font-size:15px}
.pop .field{margin-bottom:12px}
.sw-list{display:grid;gap:2px;margin:4px 0 8px}
.sw-list button{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;font-size:14px}
.sw-list button:hover{background:var(--stone)}
.sw-list button[aria-pressed="true"]{font-weight:600;background:var(--stone)}
.sw{width:14px;height:14px;background:var(--c);flex:none;display:inline-block}
.pop-foot{display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--hair)}

/* Toast & FAB */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 12px 10px 20px;border-radius:999px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{text-decoration:underline;text-underline-offset:3px;padding:2px 8px}
.toast:not(:has(button)){padding-right:20px}
.toast[popover]{inset:auto;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0;border:0;overflow:visible}
body:has(dialog[open]) .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.fab{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);place-items:center;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* Responsive */
@media (max-width:1180px){.body{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:980px){
  .app{height:auto;min-height:100%}
  .body{display:block}
  .view{overflow:visible}
  .panel{border-left:0;border-top:1px solid var(--hair);overflow:visible;padding-bottom:110px}
  .ptabs{top:0}
  .month{min-height:0}
  .fab{display:grid}
  .actions .pill.solid{display:none}
}
@media (max-width:760px){
  .views{order:3;width:100%;margin:0;justify-content:space-between;border-top:1px solid rgba(255,255,255,.25);padding-top:6px}
  .actions{margin-left:auto}
  .actions .pill{display:none}
  .hero-nav .circle{width:40px;height:40px}
  .grid{grid-auto-rows:minmax(64px,auto)}
  .cell{padding:5px 4px}
  .dnum{font-size:16px;min-width:26px;height:26px}
  .cell.today .dnum{font-size:14px}
  .hl-note,.wk,.pb span{display:none}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px}
  .chip{padding:0;margin:0}
  .chip .tx,.chip .tm{display:none}
  .more{font-size:11px}
  .pb{min-height:0;border-bottom-width:2px;font-size:0}
  .dsec{grid-template-columns:1fr;gap:6px}
  .setrow{grid-template-columns:1fr;gap:8px}
  .two{grid-template-columns:1fr}
  .newtab{grid-template-columns:1fr 1fr}
  .newtab .inp:first-child{grid-column:1/-1}
  .lrow.tabs{grid-template-columns:minmax(0,1fr) 92px 92px auto;gap:6px}
  dialog,dialog.wide{width:100vw;max-width:100vw;margin:auto 0 0;max-height:94dvh}
  .dlg-head,.dlg-body,.dlg-foot{padding-left:20px;padding-right:20px}
  .dlg-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .stabs{padding:6px 20px 0}
  .pop{left:0 !important;right:0;top:auto !important;bottom:0;width:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important;animation:none !important}}

<script>
(() => {
'use strict';

/* ================= Utilities ================= */
const LS_KEY = 'mattcal.v1';
const $ = (s, r = document) => r.querySelector(s);

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const PALETTE = ['#1E2B45','#3B5B8A','#4F6B5A','#7A8B4F','#B08D57','#8A6D3B','#9B2C2C','#8A4F6B','#6B5B8A','#555555'];

  x: '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.4"/></svg>',

};
function isoWeek(d) {

  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
const dayOfYear = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1;
const daysInYear = y => (new Date(y, 1, 29).getMonth() === 1 ? 366 : 365);

/* ================= State ================= */
function defaults() {
  return {
    v: 1,
    settings: {
      owner: 'Matt', title: 'Calendar', theme: 'auto', heroSize: 'tall', overlay: 40,
      weekStart: 1, clock24: true, showSeconds: false, defaultView: 'month',
      showProjects: true, showWeekNums: false, bgRotate: 'fixed'
    },
    categories: [
      { id: 'work', name: 'Work', color: '#1E2B45' },
      { id: 'meeting', name: 'Meeting', color: '#4F6B5A' },
      { id: 'event', name: 'Event', color: '#B08D57' },
      { id: 'urgent', name: 'Urgent', color: '#9B2C2C' },
      { id: 'personal', name: 'Personal', color: '#6B5B8A' }
    ],
    timeTabs: [
      { id: 'early', name: 'Early', start: '06:00', end: '09:00' },
      { id: 'morning', name: 'Morning', start: '09:00', end: '12:00' },
      { id: 'midday', name: 'Midday', start: '12:00', end: '14:00' },
      { id: 'afternoon', name: 'Afternoon', start: '14:00', end: '18:00' },
      { id: 'evening', name: 'Evening', start: '18:00', end: '22:00' }
    ],
    highlightStyles: [
      { id: 'holiday', name: 'Holiday', color: '#B08D57' },
      { id: 'leave', name: 'Leave', color: '#4F6B5A' },
      { id: 'deadline', name: 'Deadline', color: '#9B2C2C' },
      { id: 'travel', name: 'Travel', color: '#3B5B8A' },
      { id: 'focus', name: 'Focus day', color: '#6B6B6B' }
    ],

  };
}
function normalize(s) {

  s.v = 1;

    if (!Array.isArray(s[k])) s[k] = d[k];

}
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? normalize(JSON.parse(raw)) : null; } catch { return null; }
}
let state = loadLocal() || defaults();

const ui = {
  view: state.settings.defaultView || 'month', cursor: new Date(), selected: todayISO(),
  panel: 'day', todo: 'today', quickTab: null, sTab: 'look', lastDay: todayISO(), lastMin: -1,
  confirm: null, back: null

/* ================= Lookups ================= */
const cat = id => state.categories.find(c => c.id === id);
const tab = id => state.timeTabs.find(t => t.id === id);
const proj = id => state.projects.find(p => p.id === id);
const hlStyle = id => state.highlightStyles.find(h => h.id === id);
const tabsSorted = () => [...state.timeTabs].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
const tabForTime = t => tabsSorted().find(x => t >= x.start && t < (x.end || '24:00'));
const entryTab = e => (e.tab && tab(e.tab)) || (e.time && tabForTime(e.time)) || null;
const sortKey = e => e.time || tab(e.tab)?.start || '99:99';
const byTime = (a, b) => sortKey(a).localeCompare(sortKey(b)) || (a.created || 0) - (b.created || 0);
const isTask = e => e.kind !== 'event';
const isRepeat = e => e.repeat && e.repeat !== 'none';

function fmtTime(t) {
  if (!t) return '';

  let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;

}
function timeLabel(e) {
  if (e.time) return fmtTime(e.time) + (e.timeEnd ? '–' + fmtTime(e.timeEnd) : '');
  const t = tab(e.tab); return t ? t.name : '';
}
function fmtShort(iso) {
  const d = fromISO(iso); const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return `${d.getDate()} ${MON[d.getMonth()]}${y}`;
}
function fmtLong(iso) { const d = fromISO(iso); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }

function occursOn(e, d) {
  if (!e.date || d < e.date) return false;
  const r = e.repeat || 'none';
  if (r === 'none') return d <= (e.endDate && e.endDate > e.date ? e.endDate : e.date);
  if (e.until && d > e.until) return false;
  const a = fromISO(e.date), b = fromISO(d);
  switch (r) {
    case 'daily': return true;
    case 'weekdays': { const w = b.getDay(); return w > 0 && w < 6; }
    case 'weekly': return a.getDay() === b.getDay();
    case 'biweekly': return a.getDay() === b.getDay() && Math.round((b - a) / 864e5) % 14 === 0;
    case 'monthly': return a.getDate() === b.getDate();
    case 'yearly': return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
  }
  return false;
}
const isDone = (e, d) => isRepeat(e) ? (e.doneDates || []).includes(d) : !!e.done;
const entriesOn = d => state.entries.filter(e => occursOn(e, d)).sort(byTime);
const startOfWeek = d => addDays(d, -((d.getDay() - (+state.settings.weekStart) + 7) % 7));

function projectStats(p) {
  const tasks = state.entries.filter(e => e.project === p.id && isTask(e));
  const done = tasks.filter(e => isRepeat(e) ? false : e.done).length;
  const pct = p.mode === 'manual' ? Math.max(0, Math.min(100, +p.progress || 0))
    : (tasks.length ? Math.round(done / tasks.length * 100) : (p.status === 'done' ? 100 : 0));

/* ================= Storage (account sync when available, browser otherwise) ================= */
const Store = { mode: 'local', col: null, assets: null, downloads: null, lastSaved: {}, loaded: false, dirty: false, saving: false, again: false, t: 0, status: 'local' };
const urlCache = {};

const IDB = {
  p: null,
  open() {
    if (!this.p) this.p = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('mattcal', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('img');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('img', mode); const st = t.objectStore('img'); const req = fn(st);

  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); }
};

function splitState(s) {
  const { entries, ...meta } = s;
  const docs = { meta: clone(meta) };
  for (const e of entries) {
    const k = 'entries-' + (e.date ? e.date.slice(0, 4) : 'inbox');
    (docs[k] ||= { items: [] }).items.push(e);

}
function joinDocs(map) {
  const s = normalize(clone(map.meta || {}));
  s.entries = [];
  for (const k in map) if (k.startsWith('entries-') && Array.isArray(map[k].items)) s.entries.push(...map[k].items);

}

function setSync(s) {
  Store.status = s;
  renderHeroRight();
}
/* Change tracking: every item carries `u` (last edited, ms) and deletions leave a
   short-lived tombstone, so two devices editing at once can be merged instead of one
   overwriting the other. */
const KINDS = [['entries', 'e'], ['projects', 'p'], ['backgrounds', 'b']];
let base = null;
const bare = x => { const { u, ...rest } = x; return JSON.stringify(rest); };
function setBase() {
  base = {};
  for (const [k] of KINDS) { base[k] = {}; for (const x of state[k]) base[k][x.id] = bare(x); }

  const now = Date.now(); state.deleted = state.deleted || {};
  for (const [k, pre] of KINDS) {
    const seen = new Set();
    for (const x of state[k]) { seen.add(x.id); if (base[k][x.id] !== bare(x)) x.u = now; }
    for (const id in base[k]) if (!seen.has(id)) state.deleted[pre + ':' + id] = now;
  }
  for (const d in state.highlights) { const h = state.highlights[d]; if (base.h[d] !== bare(h)) h.u = now; }

    for (const x of (L[k] || [])) { const r = m.get(x.id); if (!r || (x.u || 0) >= (r.u || 0)) m.set(x.id, x); }
    out[k] = [...m.values()].filter(x => !((del[pre + ':' + x.id] || 0) > (x.u || 0)));
  }
  const hl = { ...(R.highlights || {}) };

function renderYear() {

  for (const e of state.entries) {
    if (!e.date || e.date > to) continue;
    if (!isRepeat(e) && !e.endDate) { if (e.date >= from) has.add(e.date); continue; }
    if (e.repeat === 'daily' || e.repeat === 'weekdays') continue;
    for (let d = fromISO(e.date < from ? from : e.date); toISO(d) <= to; d = addDays(d, 1)) {

function todoGroups(f) {

  const byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || byTime(a, b);
  switch (f) {
    case 'today': {
      const items = entriesOn(t).filter(isTask).sort((a, b) => isDone(a, t) - isDone(b, t)).map(e => ({ e, d: t }));
      return [{ h: '', items }];
    }
    case 'week': {
      const g = [];
      for (let i = 0; i < 7; i++) {
        const d = toISO(addDays(new Date(), i));
        const items = entriesOn(d).filter(isTask).filter(e => !isDone(e, d)).map(e => ({ e, d }));
        if (items.length) g.push({ h: i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : fmtLong(d), items });

}

/* ================= Import / export ================= */
async function exportData() {
  const data = JSON.stringify(state, null, 2), name = `calendar-backup-${todayISO()}.json`;
  if (Store.downloads) {
    try { await Store.downloads.save({ filename: name, data }); toast('Backup exported'); return; }
    catch (err) { if (err && err.code === 'declined') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup exported');
}
function importData(obj) {
  if (obj && obj.v && Array.isArray(obj.entries)) {
    const keepBg = state.backgrounds;
    state = normalize(clone(obj));
    if (!state.backgrounds.length) state.backgrounds = keepBg;
    return `Backup restored: ${state.entries.length} entries`;
  }
  const dateRe = /^\d{4}-\d{2}-\d{2}$/;
  const titleOf = it => it && typeof it === 'object' && (it.title || it.text || it.name || it.label || it.task || it.desc || it.description);
  const catFor = name => {
    if (!name) return state.categories[0]?.id || '';
    const n = String(name).trim().toLowerCase();
    let c = state.categories.find(x => x.id === n || x.name.toLowerCase() === n);
    if (!c) { c = { id: nid(), name: n.charAt(0).toUpperCase() + n.slice(1), color: PALETTE[state.categories.length % PALETTE.length] }; state.categories.push(c); }
    return c.id;
  };
  const normT = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? `${pad(+m[1])}:${m[2]}` : ''; };
  const entries = [], highlights = {};
  const add = (d, it) => {
    if (typeof it === 'string') it = { title: it };
    const title = titleOf(it); if (!title) return;
    const kind = /event|holiday|meeting/i.test(String(it.type || it.category || '')) ? 'event' : 'task';
    entries.push({ ...blankEntry({ date: d, kind }), id: nid(), title: String(title).slice(0, 300), time: normT(it.time || it.start), cat: catFor(it.type || it.category || it.cat || it.tag), notes: String(it.notes || it.note || ''), done: !!(it.done || it.completed || it.checked || it.cleared), doneDates: [], created: Date.now() });
  };
  const walk = (node, depth) => {
    if (depth > 7 || !node || typeof node !== 'object') return;
    if (Array.isArray(node)) {
      for (const n of node) {
        const d = n && typeof n === 'object' && String(n.date || n.day || '').slice(0, 10);
        if (d && dateRe.test(d) && titleOf(n)) add(d, n); else walk(n, depth + 1);
      }
      return;
    }
    for (const [k, v] of Object.entries(node)) {
      if (dateRe.test(k)) {
        if (Array.isArray(v)) v.forEach(it => add(k, it));
        else if (v && typeof v === 'object' && titleOf(v)) add(k, v);
        else if (v && typeof v === 'object' && Array.isArray(v.items || v.entries || v.tasks || v.logs)) (v.items || v.entries || v.tasks || v.logs).forEach(it => add(k, it));
        else if (v) highlights[k] = { style: state.highlightStyles[0]?.id, note: typeof v === 'string' && !/^(#|rgb|true|1$)/i.test(v) ? v.slice(0, 80) : '' };
      } else walk(v, depth + 1);
    }
  };
  walk(obj, 0);
  if (!entries.length && !Object.keys(highlights).length) throw new Error('nothing');
  state.entries.push(...entries);
  for (const k in highlights) if (!state.highlights[k]) state.highlights[k] = highlights[k];
  return `Imported ${entries.length} entries and ${Object.keys(highlights).length} flagged days`;
}

  ui.view = v; $('#view').scrollTop = 0;
  if (v === 'day' || v === 'week') ui.cursor = fromISO(ui.selected);
  if (v === 'month') ui.cursor = new Date(fromISO(ui.selected).getFullYear(), fromISO(ui.selected).getMonth(), 1);
  renderAll();
}
function nav(dir) {
  const c = ui.cursor; $('#view').scrollTop = 0;
  if (ui.view === 'year') ui.cursor = new Date(c.getFullYear() + dir, c.getMonth(), 1);
  else if (ui.view === 'month') ui.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
  else if (ui.view === 'week') { ui.cursor = addDays(c, 7 * dir); ui.selected = toISO(addDays(fromISO(ui.selected), 7 * dir)); }
  else { ui.cursor = addDays(c, dir); ui.selected = toISO(ui.cursor); }
  renderAll();
}
function goToday() {
  ui.selected = todayISO(); ui.cursor = new Date();
  if (ui.view === 'month') ui.cursor = new Date(ui.cursor.getFullYear(), ui.cursor.getMonth(), 1);
  renderAll();
}
function selectDate(d) {
  ui.selected = d; ui.panel = 'day';
  const dt = fromISO(d);
  if (ui.view === 'month' && dt.getMonth() !== ui.cursor.getMonth()) ui.cursor = new Date(dt.getFullYear(), dt.getMonth(), 1);
  if (ui.view === 'week') ui.cursor = dt;
  renderAll();
}

/* ================= Actions ================= */
const A = {
  prev: () => nav(-1), next: () => nav(1), today: goToday,
  view: el => setView(el.dataset.view),
  new: el => openEditor({ date: el.dataset.date ?? (ui.panel === 'todo' && ['nodate', 'open'].includes(ui.todo) ? '' : ui.selected) }),
  edit: el => openEditor({ id: el.dataset.id }),
  toggle: el => toggleDone(el.dataset.id, el.dataset.date),
  addAt: (el, ev) => { if (ev.target.closest('.blk')) return; openEditor({ date: el.dataset.date, tab: el.dataset.tab || null }); },
  panel: el => { ui.panel = el.dataset.panel; renderPanel(); },
  todo: el => { ui.todo = el.dataset.f; renderPanel(); },
  quickTab: el => { ui.quickTab = ui.quickTab === el.dataset.tab ? null : el.dataset.tab; renderPanel(); $('[data-quick="day"] input')?.focus(); },
  pickDay: el => { ui.selected = el.dataset.date; ui.panel = 'day'; renderAll(); },
  openDay: el => { ui.selected = el.dataset.date; setView('day'); },
  goMonth: el => { ui.cursor = new Date(ui.cursor.getFullYear(), +el.dataset.m, 1); ui.view = 'month'; $('#view').scrollTop = 0; renderAll(); },
  highlight: el => { const r = el.getBoundingClientRect(); openHighlight(el.dataset.date, r.left, r.bottom + 8); },
  closePop: () => closePop(),
  hlPick: el => applyHighlight(el.dataset.style),
  hlClear: () => { const days = hlRange(); days.forEach(d => delete state.highlights[d]); closePop(); commit(); toast('Highlight removed'); },
  hlStyles: () => { closePop(); openSettings('highlights'); },
  settings: () => openSettings('look'), backgrounds: () => openSettings('photos'),
  close: () => closeDialog(),
  toastAct: () => { const f = ui.toastAct; ui.toastAct = null; $('#toast').classList.remove('on'); f && f(); },

  eKind: el => { draft.kind = el.dataset.k; renderEditor(); },
  eTab: el => { draft.tab = el.dataset.tab || null; renderEditor(); $(`#dlg [data-action="eTab"][data-tab="${el.dataset.tab}"]`)?.focus(); },
  eCat: el => { draft.cat = el.dataset.cat; renderEditor(); $(`#dlg [data-action="eCat"][data-cat="${el.dataset.cat}"]`)?.focus(); },
  eNewTab: () => { draft._newTab = !draft._newTab; renderEditor(); $('#dlg [data-nt="name"]')?.focus(); },
  eAddTab: () => {
    const name = ($('#dlg [data-nt="name"]')?.value || '').trim(), start = $('#dlg [data-nt="start"]')?.value, end = $('#dlg [data-nt="end"]')?.value;
    if (!name) { $('#dlg [data-nt="name"]')?.focus(); toast('Name the tab first'); return; }
    if (!start || !end || end <= start) { toast('The tab needs to end after it starts'); return; }
    const t = { id: nid(), name, start, end }; state.timeTabs.push(t);
    draft.tab = t.id; draft._newTab = false; commit(); renderEditor(); toast(`Time tab “${name}” added`);
  },
  eDelete: () => deleteEntry(),

  newProject: () => openProject(null),
  editProject: (el, ev) => { ev.stopPropagation(); openProject(el.dataset.id); },
  pSeg: el => { pdraft[el.dataset.key] = parseSetting(el.dataset.key, el.dataset.val); renderProject(); },
  pColor: el => { pdraft.color = el.dataset.c; renderProject(); },
  pAddTask: () => {
    const ti = $('#dlg [data-pt="title"]'), title = (ti?.value || '').trim();
    if (!title) { ti?.focus(); return; }
    persistProjectDraft();
    state.entries.push({ ...blankEntry({ date: $('#dlg [data-pt="date"]')?.value || '', project: pdraft.id }), id: nid(), title, created: Date.now(), done: false, doneDates: [] });
    commit(); renderProject(); $('#dlg [data-pt="title"]')?.focus();
  },
  pDelete: () => {
    if (ui.confirm !== 'project') { ui.confirm = 'project'; renderProject(); return; }
    const snapP = clone(state.projects), snapE = clone(state.entries);
    state.projects = state.projects.filter(p => p.id !== pdraft.id);
    state.entries.forEach(e => { if (e.project === pdraft.id) e.project = ''; });
    pdraft = null; ui.confirm = null; dlg.close(); dlg.dataset.kind = ''; commit();
    toast('Project deleted. Its tasks were kept.', { label: 'Undo', fn: () => { state.projects = snapP; state.entries = snapE; commit(); } });
  },

  sTab: el => { ui.sTab = el.dataset.t; ui.confirm = null; renderSettings(); $('#dlg .dlg-body').scrollTop = 0; },
  sSeg: el => { state.settings[el.dataset.key] = parseSetting(el.dataset.key, el.dataset.val); if (el.dataset.key === 'bgRotate') bgKey = null; commit(); renderSettings(); },
  sAdd: el => {
    const list = el.dataset.list;
    const item = list === 'timeTabs' ? { id: nid(), name: 'New tab', start: '19:00', end: '21:00' }
      : { id: nid(), name: list === 'categories' ? 'New category' : 'New highlight', color: PALETTE[state[list].length % PALETTE.length] };
    state[list].push(item); commit(); renderSettings();
    const inputs = $$(`#dlg [data-list="${list}"][data-field="name"]`);
    const target = inputs.find(x => +x.dataset.i === state[list].length - 1) || inputs[inputs.length - 1];
    target?.focus(); target?.select();
  },
  sDel: el => {
    const list = el.dataset.list, i = +el.dataset.i, item = state[list][i]; if (!item) return;
    if (list !== 'highlightStyles' && state[list].length <= 1) { toast('Keep at least one'); return; }
    const snap = clone(state);
    state[list].splice(i, 1);
    if (list === 'highlightStyles') for (const d in state.highlights) if (state.highlights[d].style === item.id) delete state.highlights[d];
    commit(); renderSettings();
    toast(`“${item.name}” deleted`, { label: 'Undo', fn: () => { state = snap; commit(); if (dlg.dataset.kind === 'settings') renderSettings(); } });
  },
  uploadBg: () => $('#fileImg').click(),
  bgMonth: el => {
    const b = state.backgrounds[+el.dataset.i]; if (!b) return;
    const m = +el.dataset.m; b.months = b.months || [];
    b.months = b.months.includes(m) ? b.months.filter(x => x !== m) : [...b.months, m].sort((a, c) => a - c);
    bgKey = null; commit(); renderSettings();
  },
  bgDel: el => {
    const i = +el.dataset.i, b = state.backgrounds[i]; if (!b) return;
    state.backgrounds.splice(i, 1);
    if (b.asset && Store.assets) Store.assets.delete(b.asset).catch(() => {});
    if (b.gh && GH && b.ghSha) gh('DELETE', ghPath(b.gh), { message: 'Remove header photo', sha: b.ghSha }).catch(() => {});
    if (b.gh) { IDB.del('gh:' + b.gh).catch(() => {}); delete urlCache['gh:' + b.gh]; }
    if (b.local) { IDB.del(b.local).catch(() => {}); if (urlCache[b.local]) URL.revokeObjectURL(urlCache[b.local]); delete urlCache[b.local]; }
    bgKey = null; commit(); renderSettings(); toast('Photo removed');
  },
  export: () => exportData(),
  ghConnect: () => ghConnect(),
  ghSyncNow: async () => { if (Store.dirty) { clearTimeout(Store.t); await flush(); } else { await ghPull(); } toast(Store.status === 'gh' ? 'Up to date' : 'Sync didn’t finish. Check the status in the header.'); },
  ghDisconnect: () => {
    if (ui.confirm !== 'ghoff') { ui.confirm = 'ghoff'; renderSettings(); return; }
    try { localStorage.removeItem('mattcal.github'); localStorage.removeItem('mattcal.ghsync'); } catch {}
    GH = null; Store.mode = 'local'; Store.loaded = false; ui.confirm = null; setSync('local'); renderSettings();
    toast('This device is no longer syncing');
  },
  syncSetup: () => openSettings('data'),
  import: () => $('#fileJson').click(),
  reset: () => {
    if (ui.confirm !== 'reset') { ui.confirm = 'reset'; renderSettings(); return; }
    const snap = clone(state), keep = state.backgrounds;
    state = defaults(); state.backgrounds = keep; ui.confirm = null;
    commit(); renderSettings();
    toast('Calendar erased', { label: 'Undo', fn: () => { state = snap; commit(); if (dlg.dataset.kind === 'settings') renderSettings(); } });
  }
};

/* ================= Events ================= */
let lp = null, lpFired = false, lpStart = null;
document.addEventListener('pointerdown', ev => {
  const c = ev.target.closest('[data-hlt]');
  if (!c || ev.pointerType === 'mouse') return;
  lpFired = false; lpStart = [ev.clientX, ev.clientY];
  clearTimeout(lp);
  lp = setTimeout(() => { lpFired = true; openHighlight(c.dataset.date, ev.clientX, ev.clientY); if (navigator.vibrate) navigator.vibrate(10); }, 520);
});
document.addEventListener('pointermove', ev => { if (lp && lpStart && Math.hypot(ev.clientX - lpStart[0], ev.clientY - lpStart[1]) > 10) { clearTimeout(lp); lp = null; } });
['pointerup', 'pointercancel', 'scroll'].forEach(t => document.addEventListener(t, () => { clearTimeout(lp); lp = null; }, true));
document.addEventListener('contextmenu', ev => {
  const c = ev.target.closest('[data-hlt]');
  if (!c) return;
  ev.preventDefault();
  if (!lpFired) openHighlight(c.dataset.date, ev.clientX, ev.clientY);
});

document.addEventListener('click', ev => {
  if (lpFired) { lpFired = false; ev.preventDefault(); ev.stopPropagation(); return; }
  if (!pop.hidden && !pop.contains(ev.target)) { closePop(); if (!ev.target.closest('[data-action]')) return; }
  const a = ev.target.closest('[data-action]');
  if (a && A[a.dataset.action]) {
    if (a.dataset.action === 'addAt' && ev.target.closest('.blk')) { /* handled by inner */ }
    else { A[a.dataset.action](a, ev); return; }
  }
  const cell = ev.target.closest('[data-cell]');
  if (cell) selectDate(cell.dataset.date);
});
document.addEventListener('dblclick', ev => {
  const cell = ev.target.closest('[data-cell]');
  if (cell && !ev.target.closest('.chip,.pb')) openEditor({ date: cell.dataset.date });
  const yd = ev.target.closest('.yd');
  if (yd) { ui.selected = yd.dataset.date; setView('day'); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.dataset.quick) return quickAdd(f);
  const ae = document.activeElement;
  if (ae && ae.dataset && ae.dataset.nt) return A.eAddTab();
  if (ae && ae.dataset && ae.dataset.pt) return A.pAddTask();
  if (f.id === 'entryForm') return saveEntry();
  if (f.id === 'projForm') return saveProject(false);
});
dlg.addEventListener('input', ev => {
  const t = ev.target, kind = dlg.dataset.kind;
  if (kind === 'entry' && t.name && draft) draft[t.name] = t.value;
  if (kind === 'project' && t.name && pdraft) {
    pdraft[t.name] = t.name === 'progress' ? +t.value : t.value;
    if (t.name === 'progress') { const pv = $('#pval'); if (pv) pv.textContent = t.value + '%'; }
    if (t.name === 'color') $$('#dlg .palette button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  }
  if (kind === 'settings') {
    if (t.dataset.set === 'overlay') { state.settings.overlay = +t.value; applyLook(); scheduleSave(); }
    if (t.dataset.bgpos != null) {
      const b = state.backgrounds[+t.dataset.bgpos];
      if (b) { b.pos = +t.value; const im = $(`#dlg [data-phimg="${t.dataset.bgpos}"]`); if (im) im.style.backgroundPosition = `50% ${b.pos}%`; renderBg(); scheduleSave(); }
    }
    if (t.dataset.list && t.dataset.field === 'color') { const it = state[t.dataset.list][+t.dataset.i]; if (it) { it.color = t.value; renderAll(); scheduleSave(); } }
  }
});
dlg.addEventListener('change', ev => {
  const t = ev.target, kind = dlg.dataset.kind;
  if (kind === 'entry' && draft && ['date', 'repeat'].includes(t.name)) { draft[t.name] = t.value; if (t.name === 'date' && !t.value) { draft.endDate = ''; draft.repeat = 'none'; } renderEditor(); }
  if (kind === 'project' && pdraft && t.name === 'start') renderProject();
  if (kind === 'settings') {
    if (t.dataset.set && t.dataset.set !== 'overlay') { state.settings[t.dataset.set] = t.value; commit(); }
    if (t.dataset.list && t.dataset.field !== 'color') {
      const list = t.dataset.list, it = state[list][+t.dataset.i]; if (!it) return;
      let v = t.value;
      if (t.dataset.field === 'name') { v = v.trim(); if (!v) { t.value = it.name; return; } }
      it[t.dataset.field] = v;
      if (list === 'timeTabs' && it.end && it.start && it.end <= it.start) toast('That tab ends before it starts. Check the times.');
      commit();
      if (list === 'timeTabs' && t.dataset.field !== 'name') renderSettings();
    }
  }
});
$('#fileImg').addEventListener('change', ev => { const files = [...ev.target.files]; ev.target.value = ''; uploadImages(files); });
$('#fileJson').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  const snap = clone(state);
  try {
    const msg = importData(JSON.parse(await f.text()));
    bgKey = null; commit(); if (dlg.dataset.kind === 'settings') renderSettings();
    toast(msg, { label: 'Undo', fn: () => { state = snap; bgKey = null; commit(); if (dlg.dataset.kind === 'settings') renderSettings(); } });
  } catch { state = snap; toast('That file isn’t a calendar backup. Choose a .json export.'); }
});
pop.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { closePop(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'hlNote') {
    ev.preventDefault();
    const cur = state.highlights[ui.hlDate];
    applyHighlight(cur ? cur.style : state.highlightStyles[0]?.id);
  }
});
document.addEventListener('keydown', ev => {
  if (dlg.open) return;
  if (ev.key === 'Escape') { closePop(); return; }
  const tag = (ev.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const cell = ev.target.closest && ev.target.closest('[data-cell]');
  if (cell && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); selectDate(cell.dataset.date); return; }
  if (!pop.hidden) return;
  const k = ev.key;
  if (k === 'ArrowLeft') nav(-1);
  else if (k === 'ArrowRight') nav(1);
  else if (k === 't' || k === 'T') goToday();
  else if (k === 'n' || k === 'N') { ev.preventDefault(); A.new({ dataset: {} }); }
  else if (k === '1') setView('year'); else if (k === '2') setView('month'); else if (k === '3') setView('week'); else if (k === '4') setView('day');
  else if (k === '/') { ev.preventDefault(); ui.panel === 'projects' && (ui.panel = 'day', renderPanel()); $('.quick input')?.focus(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.view === 'month') renderView(); closePop(); }, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => renderAll());

/* ================= Boot ================= */
const heroEl = $('.hero');
const syncStage = () => app.style.setProperty('--stage-h', heroEl.offsetHeight + 'px');
if ('ResizeObserver' in window) new ResizeObserver(syncStage).observe(heroEl); else addEventListener('resize', syncStage);
syncStage();
if (ui.view === 'month') ui.cursor = new Date(ui.cursor.getFullYear(), ui.cursor.getMonth(), 1);
setBase();
renderAll();
setInterval(() => tick(false), 1000);
loadLocalImages();
initCloud().catch(err => { console.warn(err); setSync('local'); });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
